version: 2
# Security updates skip the cooldown, and pnpm refuses packages under a day old, so CI can fail for
# up to a day.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      aws-sdk:
        patterns: ['@aws-sdk/*']
    ignore:
      # Lambda runtime is nodejs24.x, so keep the types on Node 24
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
  - package-ecosystem: terraform
    directory: /infra/terraform/bootstrap
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
  - package-ecosystem: terraform
    directory: /infra/terraform/envs/staging
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
  - package-ecosystem: terraform
    directory: /infra/terraform/envs/demo
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
  - package-ecosystem: terraform
    directory: /infra/terraform/modules/blockwarden
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
  - package-ecosystem: terraform
    directory: /infra/terraform/modules/relayer
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
  - package-ecosystem: terraform
    directory: /infra/terraform/examples/relayer-only
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
