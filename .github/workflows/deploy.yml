name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: The stack to deploy. The demo waits for the owner's approval in its GitHub environment.
        type: choice
        options: [demo, staging]
        required: true

permissions:
  id-token: write
  contents: read

defaults:
  run:
    shell: bash

# The two jobs are the same steps for two stacks. They are not one job over a matrix because each needs its own
# role variable, and an expression that picks one of two variables falls through to the other when the first is
# unset.
jobs:
  staging:
    # a dispatch can name any branch; only main is ever applied
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.environment == 'staging')
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      ROLE_ARN: ${{ vars.BLOCKWARDEN_STAGING_APPLY_ROLE_ARN }}
      ROLE_VARIABLE: BLOCKWARDEN_STAGING_APPLY_ROLE_ARN
      ENVIRONMENT: staging
      TF_IN_AUTOMATION: '1'
      TF_INPUT: '0'
    steps:
      - name: Skip until the role variable is set
        id: gate
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$ROLE_VARIABLE is not set, so this job did nothing."
            echo "The repository variable \`$ROLE_VARIABLE\` is not set, so this job did nothing. Setting it is what switches the pipeline on: see Deploying in the README." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.enabled == 'true'
      - uses: ./.github/actions/build
        if: steps.gate.outputs.enabled == 'true'
        with:
          environment: staging
      - name: Read the stack's inputs
        if: steps.gate.outputs.enabled == 'true'
        env:
          REGION: ${{ vars.BLOCKWARDEN_AWS_REGION }}
          STATE_BUCKET: ${{ vars.BLOCKWARDEN_STATE_BUCKET }}
          ALLOWED_WALLETS: ${{ vars.BLOCKWARDEN_ALLOWED_WALLETS }}
          ALARM_EMAIL: ${{ vars.BLOCKWARDEN_ALARM_EMAIL }}
        run: |
          for name in REGION STATE_BUCKET ALLOWED_WALLETS; do
            if [ -z "${!name}" ]; then
              echo "::error::BLOCKWARDEN_${name/REGION/AWS_REGION} is not set; see Deploying in the README."
              exit 1
            fi
          done
          {
            echo "TF_VAR_region=$REGION"
            echo "TF_VAR_allowed_wallets=$ALLOWED_WALLETS"
            echo "STATE_BUCKET=$STATE_BUCKET"
            # alarm_email is optional, and an empty string would be an address
            if [ -n "$ALARM_EMAIL" ]; then echo "TF_VAR_alarm_email=$ALARM_EMAIL"; fi
          } >> "$GITHUB_ENV"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: steps.gate.outputs.enabled == 'true'
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ vars.BLOCKWARDEN_AWS_REGION }}
          role-session-name: deploy-staging-${{ github.run_id }}
          mask-aws-account-id: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: steps.gate.outputs.enabled == 'true'
        with:
          terraform_version: 1.16.2
          terraform_wrapper: false
      - name: terraform init
        if: steps.gate.outputs.enabled == 'true'
        working-directory: infra/terraform/envs/staging
        run: >-
          terraform init
          -backend-config="bucket=$STATE_BUCKET"
          -backend-config="key=$ENVIRONMENT/terraform.tfstate"
          -backend-config="region=$TF_VAR_region"
      # The plan's text and the apply's (resource ids, and every output with its ARNs and account id) hold the
      # stack's values and this repository's logs are public, so both go nowhere; errors are on stderr and still
      # reach the log. The apply takes the saved plan, so what is applied is exactly what was planned here.
      - name: terraform plan
        if: steps.gate.outputs.enabled == 'true'
        working-directory: infra/terraform/envs/staging
        run: terraform plan -lock-timeout=10m -no-color -out=tfplan > /dev/null
      - name: terraform apply
        if: steps.gate.outputs.enabled == 'true'
        working-directory: infra/terraform/envs/staging
        run: terraform apply -auto-approve -lock-timeout=10m -no-color tfplan > /dev/null
      - name: Upload the dashboard
        if: steps.gate.outputs.enabled == 'true'
        run: |
          bucket="$(terraform -chdir=infra/terraform/envs/staging output -raw site_bucket)"
          aws s3 sync apps/dashboard/out "s3://$bucket" --delete --only-show-errors
      - name: Invalidate the distribution's cache
        if: steps.gate.outputs.enabled == 'true'
        run: |
          distribution="$(terraform -chdir=infra/terraform/envs/staging output -raw distribution_id)"
          aws cloudfront create-invalidation --distribution-id "$distribution" --paths '/*' --query Invalidation.Id --output text

  demo:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.environment == 'demo'
    runs-on: ubuntu-latest
    environment: demo
    concurrency:
      group: deploy-demo
      cancel-in-progress: false
    env:
      ROLE_ARN: ${{ vars.BLOCKWARDEN_DEMO_APPLY_ROLE_ARN }}
      ROLE_VARIABLE: BLOCKWARDEN_DEMO_APPLY_ROLE_ARN
      ENVIRONMENT: demo
      TF_IN_AUTOMATION: '1'
      TF_INPUT: '0'
    steps:
      - name: Skip until the role variable is set
        id: gate
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$ROLE_VARIABLE is not set, so this job did nothing."
            echo "The repository variable \`$ROLE_VARIABLE\` is not set, so this job did nothing. Setting it is what switches the pipeline on: see Deploying in the README." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.enabled == 'true'
      - uses: ./.github/actions/build
        if: steps.gate.outputs.enabled == 'true'
        with:
          environment: demo
      - name: Read the stack's inputs
        if: steps.gate.outputs.enabled == 'true'
        env:
          REGION: ${{ vars.BLOCKWARDEN_AWS_REGION }}
          STATE_BUCKET: ${{ vars.BLOCKWARDEN_STATE_BUCKET }}
          ALLOWED_WALLETS: ${{ vars.BLOCKWARDEN_ALLOWED_WALLETS }}
          ALARM_EMAIL: ${{ vars.BLOCKWARDEN_ALARM_EMAIL }}
        run: |
          for name in REGION STATE_BUCKET ALLOWED_WALLETS; do
            if [ -z "${!name}" ]; then
              echo "::error::BLOCKWARDEN_${name/REGION/AWS_REGION} is not set; see Deploying in the README."
              exit 1
            fi
          done
          {
            echo "TF_VAR_region=$REGION"
            echo "TF_VAR_allowed_wallets=$ALLOWED_WALLETS"
            echo "STATE_BUCKET=$STATE_BUCKET"
            # alarm_email is optional, and an empty string would be an address
            if [ -n "$ALARM_EMAIL" ]; then echo "TF_VAR_alarm_email=$ALARM_EMAIL"; fi
          } >> "$GITHUB_ENV"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: steps.gate.outputs.enabled == 'true'
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ vars.BLOCKWARDEN_AWS_REGION }}
          role-session-name: deploy-demo-${{ github.run_id }}
          mask-aws-account-id: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: steps.gate.outputs.enabled == 'true'
        with:
          terraform_version: 1.16.2
          terraform_wrapper: false
      - name: terraform init
        if: steps.gate.outputs.enabled == 'true'
        working-directory: infra/terraform/envs/demo
        run: >-
          terraform init
          -backend-config="bucket=$STATE_BUCKET"
          -backend-config="key=$ENVIRONMENT/terraform.tfstate"
          -backend-config="region=$TF_VAR_region"
      - name: terraform plan
        if: steps.gate.outputs.enabled == 'true'
        working-directory: infra/terraform/envs/demo
        run: terraform plan -lock-timeout=10m -no-color -out=tfplan > /dev/null
      - name: terraform apply
        if: steps.gate.outputs.enabled == 'true'
        working-directory: infra/terraform/envs/demo
        run: terraform apply -auto-approve -lock-timeout=10m -no-color tfplan > /dev/null
      - name: Upload the dashboard
        if: steps.gate.outputs.enabled == 'true'
        run: |
          bucket="$(terraform -chdir=infra/terraform/envs/demo output -raw site_bucket)"
          aws s3 sync apps/dashboard/out "s3://$bucket" --delete --only-show-errors
      - name: Invalidate the distribution's cache
        if: steps.gate.outputs.enabled == 'true'
        run: |
          distribution="$(terraform -chdir=infra/terraform/envs/demo output -raw distribution_id)"
          aws cloudfront create-invalidation --distribution-id "$distribution" --paths '/*' --query Invalidation.Id --output text
