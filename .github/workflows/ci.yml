name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run typecheck
      - run: pnpm run test
      # pulled up front so the downloads do not count against the tests' container start timeouts
      - run: |
          docker pull ghcr.io/foundry-rs/foundry:v1.8.1
          docker pull amazon/dynamodb-local:3.3.1
          docker pull motoserver/moto:5.2.3
      - run: pnpm run test:integration
      - run: pnpm --filter @blockwarden/monitor run build
      - run: pnpm --filter @blockwarden/relayer run build
      - run: pnpm --filter @blockwarden/actions run build
      - run: node scripts/pack-check.mjs

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/tf-check.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --redact --verbose
