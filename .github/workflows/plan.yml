name: plan

on:
  pull_request:

permissions:
  id-token: write
  contents: read
  pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  # runs whether or not the pipeline is switched on, since a variable is declared long before anything is applied
  sensitive-variables:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: node tools/pipeline/src/sensitive-vars.mjs

  plan:
    needs: sensitive-variables
    # GitHub gives a pull request from a fork no OIDC token, so there is nothing for it to plan with
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [staging, demo]
    env:
      ROLE_ARN: ${{ vars.BLOCKWARDEN_PLAN_ROLE_ARN }}
      ROLE_VARIABLE: BLOCKWARDEN_PLAN_ROLE_ARN
      ENVIRONMENT: ${{ matrix.environment }}
      TF_IN_AUTOMATION: '1'
      TF_INPUT: '0'
    steps:
      - name: Skip until the role variable is set
        id: gate
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$ROLE_VARIABLE is not set, so this job did nothing."
            echo "The repository variable \`$ROLE_VARIABLE\` is not set, so this job did nothing. Setting it is what switches the pipeline on: see Deploying in the README." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.enabled == 'true'
      - uses: ./.github/actions/build
        if: steps.gate.outputs.enabled == 'true'
        with:
          environment: ${{ matrix.environment }}
      - name: Read the stack's inputs
        if: steps.gate.outputs.enabled == 'true'
        env:
          REGION: ${{ vars.BLOCKWARDEN_AWS_REGION }}
          STATE_BUCKET: ${{ vars.BLOCKWARDEN_STATE_BUCKET }}
          ALLOWED_WALLETS: ${{ vars.BLOCKWARDEN_ALLOWED_WALLETS }}
          ALARM_EMAIL: ${{ vars.BLOCKWARDEN_ALARM_EMAIL }}
        run: |
          for name in REGION STATE_BUCKET ALLOWED_WALLETS; do
            if [ -z "${!name}" ]; then
              echo "::error::BLOCKWARDEN_${name/REGION/AWS_REGION} is not set; see Deploying in the README."
              exit 1
            fi
          done
          {
            echo "TF_VAR_region=$REGION"
            echo "TF_VAR_allowed_wallets=$ALLOWED_WALLETS"
            echo "STATE_BUCKET=$STATE_BUCKET"
            # alarm_email is optional, and an empty string would be an address
            if [ -n "$ALARM_EMAIL" ]; then echo "TF_VAR_alarm_email=$ALARM_EMAIL"; fi
          } >> "$GITHUB_ENV"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: steps.gate.outputs.enabled == 'true'
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ vars.BLOCKWARDEN_AWS_REGION }}
          role-session-name: plan-${{ matrix.environment }}-${{ github.run_id }}
          mask-aws-account-id: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: steps.gate.outputs.enabled == 'true'
        with:
          terraform_version: 1.16.2
          terraform_wrapper: false
      - name: terraform init
        if: steps.gate.outputs.enabled == 'true'
        working-directory: infra/terraform/envs/${{ matrix.environment }}
        run: >-
          terraform init
          -backend-config="bucket=$STATE_BUCKET"
          -backend-config="key=$ENVIRONMENT/terraform.tfstate"
          -backend-config="region=$TF_VAR_region"
      # The plan's text holds the stack's values and this repository's logs are public, so it goes nowhere;
      # Terraform's errors are on stderr and still reach the log.
      - name: terraform plan
        id: plan
        if: steps.gate.outputs.enabled == 'true'
        working-directory: infra/terraform/envs/${{ matrix.environment }}
        run: terraform plan -lock-timeout=10m -no-color -out=tfplan > /dev/null
      - name: Comment the summary
        if: steps.gate.outputs.enabled == 'true' && !cancelled()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
        run: |
          if [ "$PLAN_OUTCOME" = success ]; then
            terraform -chdir="infra/terraform/envs/$ENVIRONMENT" show -json tfplan |
              node tools/pipeline/src/plan-comment.mjs --environment "$ENVIRONMENT" --plan -
          else
            node tools/pipeline/src/plan-comment.mjs --environment "$ENVIRONMENT" --failed
          fi
